<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sunyani Shop</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap">
<style>
:root{--bg:#f2f6f3;--surface:#fff;--ink:#14231b;--muted:#5d6f65;--line:#d9e3dc;--green:#1f5a3f;--on-green:#fff;--gold:#f0b429;--on-gold:#2a1f00;--danger:#b3261e;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a14;--surface:#16251d;--ink:#eaf2ec;--muted:#98ab9f;--line:#27382e;--green:#2f7a56;--gold:#f0b429;--danger:#ff8a80;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1a14;--surface:#16251d;--ink:#eaf2ec;--muted:#98ab9f;--line:#27382e;--green:#2f7a56;--gold:#f0b429;--danger:#ff8a80;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.4;padding-bottom:84px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--green);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--green);color:var(--on-green);padding:14px 16px 12px}
.brand{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
h1{margin:0;font-size:22px;font-weight:800;letter-spacing:-.01em}
.tag{font-size:12px;opacity:.85}
.search{margin-top:10px;width:100%;border:0;border-radius:10px;padding:11px 12px;font:inherit;background:var(--surface);color:var(--ink)}
main{max-width:720px;margin:0 auto;padding:12px 16px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 14px;font:inherit;font-size:14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--green);color:var(--on-green);border-color:var(--green)}
.chip.mall[aria-pressed="true"]{background:var(--gold);color:var(--on-gold);border-color:var(--gold);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:560px){.grid{grid-template-columns:repeat(3,1fr)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:4px}
.pic{font-size:44px;text-align:center;background:var(--bg);border-radius:10px;padding:10px 0}
.card b{font-size:15px;font-weight:600}
.mall-name{font-size:12px;color:var(--muted)}
.price{font-weight:800;font-size:17px;margin-top:2px}
.btn{border:0;border-radius:10px;padding:10px 14px;font:inherit;font-weight:600;cursor:pointer;background:var(--green);color:var(--on-green)}
.btn.gold{background:var(--gold);color:var(--on-gold)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn:focus-visible,.chip:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.qty{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:6px}
.qty button{width:38px;height:38px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font-size:20px;cursor:pointer}
.bar{position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line);z-index:9}
.bar .btn{width:100%;display:flex;justify-content:space-between}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.row small{color:var(--muted);display:block}
.total{font-weight:800;font-size:18px}
label{display:block;font-weight:600;margin:14px 0 6px;font-size:14px}
input,select{width:100%;padding:11px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:inherit}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;align-items:center;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface);font-weight:400;margin:0}
.opt input{width:auto}
.err{color:var(--danger);font-size:14px;margin-top:8px;min-height:20px}
.note{font-size:13px;color:var(--muted);margin-top:14px}
.empty{text-align:center;color:var(--muted);padding:40px 0}
.done{text-align:center;padding:30px 0}
.done .big{font-size:56px}
h2{font-size:20px;margin:6px 0 4px}
.pic.photo{padding:0;overflow:hidden;height:110px}.pic.photo img{width:100%;height:100%;object-fit:cover;display:block}
.thumb{width:48px;height:48px;border-radius:8px;object-fit:cover;background:var(--bg);display:inline-flex;align-items:center;justify-content:center;font-size:26px;flex:none}
.sm{padding:8px 12px;font-size:14px}.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.gal{position:relative}.pic.photo{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}.pic.photo::-webkit-scrollbar{display:none}.pic.photo img{flex:none;width:100%;scroll-snap-align:center}
.cnt{position:absolute;right:6px;bottom:6px;background:rgba(0,0,0,.6);color:#fff;font-size:11px;padding:2px 8px;border-radius:999px;pointer-events:none}
#lb[hidden]{display:none}#lb{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.95);color:#fff;display:flex;flex-direction:column;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
.lbtop{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 16px;font-weight:600}
.lbx{flex:none;width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.15);color:#fff;font-size:26px;cursor:pointer}
.lbmain{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.lbmain img{max-width:100%;max-height:100%;object-fit:contain}
.lbn{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:64px;border:0;border-radius:10px;background:rgba(255,255,255,.18);color:#fff;font-size:34px;cursor:pointer}.lbn.l{left:8px}.lbn.r{right:8px}
.lbth{display:flex;gap:8px;justify-content:center;padding:12px 16px;overflow-x:auto}.lbth img{width:56px;height:56px;object-fit:cover;border-radius:8px;opacity:.55;border:2px solid transparent;flex:none;cursor:pointer}.lbth img.on{opacity:1;border-color:var(--gold)}
.pw{position:relative;display:inline-block;margin:0 10px 10px 0}.thumb.big{width:72px;height:72px}
.rm{position:absolute;top:-8px;right:-8px;width:26px;height:26px;border-radius:50%;border:0;background:var(--danger);color:#fff;font-size:16px;cursor:pointer}
.xb{border:0;background:none;color:inherit;font-size:18px;cursor:pointer;padding:0 2px}
a{color:inherit}
</style>
</head>
<body>
<header>
  <div class="brand"><h1>Sunyani Shop</h1><span class="tag">Shop from home · v5</span><button class="chip" id="mg" onclick="mgBtn()">Owner login</button></div>
  <input class="search" id="q" type="search" placeholder="Search products" aria-label="Search products">
</header>
<main id="app"><div class="empty">Loading…</div></main>
<div class="bar" id="bar" hidden></div>
<div id="lb" hidden></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
var CFG={url:"https://hpdhmrnnlyftautoyyyz.supabase.co",key:"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhwZGhtcm5ubHlmdGF1dG95eXl6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI5NDg3ODIsImV4cCI6MjEwODUyNDc4Mn0.i5hmfJXfaHnONl8riJkQ18T2dYdkdO7lVNVgAIf0n0w",wa:"233549971535",fee:10};
var sb=supabase.createClient(CFG.url,CFG.key);
var MALLS=[],CATS=[],AREAS=[],P=[],LB=null,SOLD={},SALES=null;
var S={view:"shop",mall:0,cat:0,q:"",cart:{},user:null,tab:"items",edit:null,photos:null,del:null,err:"",done:null};
var app=document.getElementById("app"),bar=document.getElementById("bar");
var G=function(i){return document.getElementById(i)};
var $=function(n){return "GH₵ "+Number(n).toLocaleString("en-GH")};
var esc=function(s){var d=document.createElement("div");d.textContent=s==null?"":s;return d.innerHTML};
var qa=function(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;")};
var nmOf=function(L,id){return (L.find(function(x){return x.id===id})||{}).name||""};
var count=function(){return Object.values(S.cart).reduce(function(a,b){return a+b},0)};
var sub=function(){return P.reduce(function(t,x){return t+(S.cart[x.id]?x.price*S.cart[x.id]:0)},0)};
function add(id,d){S.cart[id]=(S.cart[id]||0)+d;if(S.cart[id]<=0)delete S.cart[id];draw()}
function go(v){S.view=v;draw();scrollTo(0,0)}
function chip(l,on,fn,c){return '<button class="chip '+(c||"")+'" aria-pressed="'+on+'" onclick="'+fn+'">'+l+'</button>'}
function qtyBox(id,q){return '<div class="qty"><button aria-label="Remove one" onclick="add('+id+',-1)">−</button><b>'+q+'</b><button aria-label="Add one" onclick="add('+id+',1)">+</button></div>'}

async function load(){
  var r=await Promise.all([sb.from("malls").select("*").order("id"),sb.from("categories").select("*").order("id"),sb.from("products").select("*").order("id",{ascending:false})]);
  if(r.some(function(x){return x.error})){S.err="Could not load the shop. Check your internet and refresh."}
  else{MALLS=r[0].data;CATS=r[1].data;P=r[2].data;S.err=""}
  var ar=await sb.from("areas").select("*").order("name");AREAS=ar.error?[]:ar.data;
  draw();
}

/* ---------- customer side ---------- */
function pic(x){var L=x.photos||[];if(!L.length)return '<div class="pic" aria-hidden="true">🛍️</div>';
  return '<div class="gal"><div class="pic photo">'+L.map(function(u,i){return '<img loading="lazy" alt="Photo '+(i+1)+'" src="'+qa(u)+'" onclick="openLB('+x.id+','+i+')">'}).join("")+'</div>'+(L.length>1?'<span class="cnt">'+L.length+' photos · swipe</span>':'')+'</div>'}
function shop(){
  if(S.err)return '<div class="empty">'+S.err+'</div>';
  var h='<div class="chips">'+chip("All",!S.cat,"S.cat=0;draw()")+CATS.map(function(c){return chip(esc(c.name),S.cat===c.id,"S.cat="+c.id+";draw()")}).join("")+'</div>';
  var L=P.filter(function(x){return (!S.mall||x.mall_id===S.mall)&&(!S.cat||x.category_id===S.cat)&&(!S.q||x.name.toLowerCase().indexOf(S.q)>-1)});
  if(!L.length)return h+'<div class="empty">'+(P.length?'No products match. Try another mall or category.':'No items yet. Please check back soon.')+'</div>';
  return h+'<div class="grid">'+L.map(function(x){var q=S.cart[x.id]||0;
    return '<div class="card">'+pic(x)+'<b>'+esc(x.name)+'</b><span class="price">'+$(x.price)+'</span>'+(q?qtyBox(x.id,q):'<button class="btn" onclick="add('+x.id+',1)">Add to cart</button>')+'</div>'}).join("")+'</div>';
}
function cart(){
  var h='<h2>Your cart</h2>';
  if(!count())return h+'<div class="empty">Your cart is empty.</div><button class="btn" onclick="go(\'shop\')">Browse products</button>';
  P.forEach(function(x){var q=S.cart[x.id];if(q)h+='<div class="row"><div><b>'+esc(x.name)+'</b><small>'+$(x.price)+' each</small></div>'+qtyBox(x.id,q)+'</div>'});
  return h+'<div class="row"><span>Items</span><span class="total">'+$(sub())+'</span></div><p class="note">The delivery fee is agreed with you on WhatsApp after you order.</p><button class="btn ghost" onclick="go(\'shop\')">Add more items</button>';
}
function checkout(){
  return '<h2>Checkout</h2><label for="nm">Full name</label><input id="nm" autocomplete="name" maxlength="100">'+
  '<label for="ph">Phone number (for delivery calls)</label><input id="ph" type="tel" inputmode="tel" placeholder="024 000 0000" autocomplete="tel" maxlength="20">'+
  
  '<div id="addr"><label for="ad">Delivery area and landmark</label><input id="ad" placeholder="e.g. Estate, near the Methodist Church" maxlength="300"><p class="note">The delivery fee is not included. We will agree it with you on WhatsApp.</p></div>'+
  '<label>Payment</label><div class="opts"><label class="opt"><input type="radio" name="pay" value="MoMo" checked> Mobile Money</label><label class="opt"><input type="radio" name="pay" value="Cash"> Pay on delivery or pickup</label></div>'+
  '<div class="row" style="margin-top:14px"><span>Items total</span><span class="total" id="tt"></span></div><div class="row"><span>Delivery fee</span><span>To be agreed</span></div><div class="err" id="err" role="alert"></div>';
}
function areaBox(){return AREAS.length?'<label for="ar">Delivery area</label><select id="ar" onchange="fee()">'+AREAS.map(function(a){return '<option value="'+a.id+'">'+esc(a.name)+' - '+$(a.fee)+'</option>'}).join("")+'</select>':'<p class="note">Delivery fee: '+$(CFG.fee)+'</p>'}
function curFee(){var el=G("ar");if(!AREAS.length||!el)return CFG.fee;var a=AREAS.find(function(x){return String(x.id)===el.value});return a?Number(a.fee):CFG.fee}
function fee(){G("tt").textContent=$(sub())}
async function place(){
  var nme=G("nm").value.trim(),phn=G("ph").value.replace(/\s/g,""),d=true,ad=G("ad").value.trim(),pay=document.querySelector('input[name="pay"]:checked').value,e=G("err");
  if(!nme){e.textContent="Enter your name.";return}
  if(!/^(\+?233|0)\d{9}$/.test(phn)){e.textContent="Enter a valid Ghana phone number, like 0240000000.";return}
  if(d&&!ad){e.textContent="Enter a delivery address or landmark.";return}
  G("pb").disabled=true;e.textContent="Sending…";
  var items=P.filter(function(x){return S.cart[x.id]}).map(function(x){return {id:x.id,name:x.name,qty:S.cart[x.id],price:x.price}});
  var no="SY-"+Math.floor(1000+Math.random()*9000),tot=sub();
  var r=await sb.from("orders").insert({code:no,customer:nme,phone:phn,delivery:d,address:ad,payment:pay,items:items,total:tot});
  var msg="New order "+no+"\n"+items.map(function(i){return i.qty+" x "+i.name+" - GH₵"+(i.price*i.qty)}).join("\n")+"\n"+"Items total: GH₵"+tot+"\nDelivery fee: to be agreed"+"\nName: "+nme+"\nPhone: "+phn+"\n"+"Deliver to: "+ad+"\nPayment: "+pay;
  S.done={no:no,nm:nme,tot:tot,d:d,pay:pay,saved:!r.error,wa:"https://wa.me/"+CFG.wa+"?text="+encodeURIComponent(msg)};S.cart={};go("done");
}
function done(){var o=S.done;
  return '<div class="done"><div class="big">✅</div><h2>Order '+o.no+' is ready</h2><p>Thank you, '+esc(o.nm)+'. Items total: <b>'+$(o.tot)+'</b></p><p class="note">'+'We will message you on WhatsApp to agree the delivery fee and arrange delivery.'+(o.pay==="MoMo"?' We will send Mobile Money payment details once the delivery fee is agreed.':' Pay when you receive it.')+'</p>'+
  '<a class="btn gold" style="display:block;text-decoration:none;margin:16px 0 6px" href="'+o.wa+'" target="_blank" rel="noopener">Send order on WhatsApp</a><p class="note">'+(o.saved?'Tap the button so the shop can confirm your order with you.':'Your order was not saved online. Please tap the button to send it.')+'</p><button class="btn ghost" onclick="S.done=null;go(\'shop\')">Keep shopping</button></div>';
}

/* ---------- photo viewer ---------- */
function openLB(id,i){var x=P.find(function(y){return y.id===id});if(!x||!x.photos||!x.photos.length)return;LB={L:x.photos,i:i||0,t:x.name};drawLB();G("lb").hidden=false}
function closeLB(){LB=null;G("lb").hidden=true}
function stepLB(d){if(!LB)return;LB.i=(LB.i+d+LB.L.length)%LB.L.length;drawLB()}
function drawLB(){var n=LB.L.length,h='<div class="lbtop"><span>'+esc(LB.t)+(n>1?' · '+(LB.i+1)+'/'+n:'')+'</span><button class="lbx" aria-label="Close" onclick="closeLB()">×</button></div><div class="lbmain"><img alt="" src="'+qa(LB.L[LB.i])+'">';
  if(n>1)h+='<button class="lbn l" aria-label="Previous photo" onclick="stepLB(-1)">‹</button><button class="lbn r" aria-label="Next photo" onclick="stepLB(1)">›</button>';
  h+='</div>';
  if(n>1){h+='<div class="lbth">';LB.L.forEach(function(u,k){h+='<img class="'+(k===LB.i?'on':'')+'" alt="Photo '+(k+1)+'" src="'+qa(u)+'" onclick="LB.i='+k+';drawLB()">'});h+='</div>'}
  G("lb").innerHTML=h}
(function(){var el=G("lb"),sx=0,ok=false;
  el.addEventListener("touchstart",function(e){sx=e.changedTouches[0].clientX;ok=!!e.target.closest(".lbmain")},{passive:true});
  el.addEventListener("touchend",function(e){var d=e.changedTouches[0].clientX-sx;if(ok&&Math.abs(d)>50)stepLB(d<0?1:-1)},{passive:true});
  document.addEventListener("keydown",function(e){if(!LB)return;if(e.key==="Escape")closeLB();if(e.key==="ArrowLeft")stepLB(-1);if(e.key==="ArrowRight")stepLB(1)})})();

/* ---------- owner side ---------- */
function mgBtn(){S.edit=null;S.del=null;if(!S.user)return go("login");go(S.view==="admin"?"shop":"admin")}
function login(){return '<h2>Owner login</h2><label for="em">Email</label><input id="em" type="email" autocomplete="username"><label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password"><div class="err" id="le" role="alert"></div><div class="acts"><button class="btn" onclick="doLogin()">Log in</button><button class="btn ghost" onclick="go(\'shop\')">Cancel</button></div>'}
async function doLogin(){var r=await sb.auth.signInWithPassword({email:G("em").value.trim(),password:G("pw").value});if(r.error){G("le").textContent="Wrong email or password.";return}S.user=r.data.user;S.tab="items";go("admin")}
async function doLogout(){await sb.auth.signOut();S.user=null;SALES=null;SOLD={};go("shop")}
function admin(){
  var h='<h2>Manage shop</h2><div class="chips">'+[["items","Items"],["sales","Sales"],["orders","Orders"],["cats","Categories"]].map(function(t){return chip(t[1],S.tab===t[0],"S.tab='"+t[0]+"';S.edit=null;draw()")}).join("")+chip("Log out",false,"doLogout()")+'</div>';
  if(S.tab==="items")return h+items();
  if(S.tab==="sales")return h+'<div id="sl" class="empty">Loading…</div>';
  if(S.tab==="orders")return h+'<div id="ol" class="empty">Loading…</div>';
  return h+names("categories",CATS);
}
var opts=function(L,sel){return L.map(function(o){return '<option value="'+o.id+'"'+(o.id===sel?' selected':'')+'>'+esc(o.name)+'</option>'}).join("")};
var thumbs=function(){return S.photos.map(function(p,i){return '<span class="pw"><img class="thumb big" alt="" src="'+qa(p.url)+'"><button class="rm" aria-label="Remove photo" onclick="rmPhoto('+i+')">×</button></span>'}).join("")};
function rmPhoto(i){S.photos.splice(i,1);G("ph").innerHTML=thumbs()}
function addPhotos(inp){var fs=Array.prototype.slice.call(inp.files);inp.value="";fs.forEach(function(f){if(S.photos.length<6)S.photos.push({url:URL.createObjectURL(f),file:f})});G("ph").innerHTML=thumbs()}
async function resize(f){var b=await createImageBitmap(f),s=Math.min(1,1000/Math.max(b.width,b.height)),c=document.createElement("canvas");c.width=Math.round(b.width*s);c.height=Math.round(b.height*s);c.getContext("2d").drawImage(b,0,0,c.width,c.height);return new Promise(function(ok){c.toBlob(ok,"image/jpeg",.85)})}
function items(){
  if(S.edit!==null){
    var x=P.find(function(y){return y.id===S.edit})||{name:"",price:"",mall_id:(MALLS[0]||{}).id,category_id:(CATS[0]||{}).id,photos:[]};
    if(S.photos===null)S.photos=(x.photos||[]).map(function(u){return {url:u}});
    return '<label for="an">Item name</label><input id="an" maxlength="120" value="'+qa(x.name)+'"><label for="ap">Price (GH₵)</label><input id="ap" type="number" inputmode="decimal" min="0" value="'+qa(x.price)+'"><label for="ac">Category</label><select id="ac">'+opts(CATS,x.category_id)+'</select><label for="af">Photos (up to 6, the first is the main photo)</label><div id="ph">'+thumbs()+'</div><input id="af" type="file" accept="image/*" multiple onchange="addPhotos(this)"><div class="err" id="ae" role="alert"></div><div class="acts"><button class="btn" id="sv" onclick="saveItem()">Save item</button><button class="btn ghost" onclick="S.edit=null;draw()">Cancel</button>'+(S.edit?'<button class="btn ghost" onclick="delItem('+S.edit+')">'+(S.del===S.edit?'Tap again to delete':'Delete')+'</button>':'')+'</div>';
  }
  S.photos=null;
  return '<div class="acts"><button class="btn" onclick="S.edit=0;draw()">Add item</button></div><p class="note">'+P.length+' items for sale</p><input id="iq" type="search" placeholder="Search your items" value="'+qa(S.iq||"")+'" oninput="S.iq=this.value.toLowerCase();G(\'il\').innerHTML=itemRows()"><div id="il">'+itemRows()+'</div>';
}
function itemRows(){
  return P.filter(function(x){return !S.iq||x.name.toLowerCase().indexOf(S.iq)>-1}).map(function(x){return '<div class="row"><div style="display:flex;gap:10px;align-items:center">'+(x.photos&&x.photos[0]?'<img class="thumb" alt="" src="'+qa(x.photos[0])+'">':'<span class="thumb">🛍️</span>')+'<div><b>'+esc(x.name)+'</b><small>'+$(x.price)+' · '+esc(nmOf(CATS,x.category_id)||"No category")+(SOLD[x.id]?' · sold '+SOLD[x.id]:'')+'</small></div></div><button class="btn ghost sm" onclick="S.edit='+x.id+';S.del=null;draw()">Edit</button></div>'}).join("");
}
async function saveItem(){
  var e=G("ae"),n=G("an").value.trim(),p=parseFloat(G("ap").value);
  if(!n){e.textContent="Enter the item name.";return}
  if(!(p>=0)){e.textContent="Enter a price, like 85.";return}
  var b=G("sv");b.disabled=true;e.textContent="Saving…";
  try{
    var urls=[];
    for(var i=0;i<S.photos.length;i++){var f=S.photos[i];if(!f.file){urls.push(f.url);continue}
      var path="p/"+Date.now()+"-"+i+".jpg",up=await sb.storage.from("photos").upload(path,await resize(f.file),{contentType:"image/jpeg"});
      if(up.error)throw up.error;urls.push(sb.storage.from("photos").getPublicUrl(path).data.publicUrl)}
    var row={name:n,price:p,category_id:+G("ac").value,photos:urls};
    var r=S.edit?await sb.from("products").update(row).eq("id",S.edit):await sb.from("products").insert(row);
    if(r.error)throw r.error;
    S.edit=null;await load();
  }catch(x){b.disabled=false;e.textContent="Could not save: "+(x.message||"try again.")}
}
async function delItem(id){if(S.del!==id){S.del=id;draw();return}await sb.from("products").delete().eq("id",id);S.del=null;S.edit=null;await load()}
function names(t,L){return '<div class="chips" style="flex-wrap:wrap;overflow:visible">'+L.map(function(c){return '<span class="chip" style="display:inline-flex;gap:8px;align-items:center">'+esc(c.name)+'<button class="xb" aria-label="Remove '+qa(c.name)+'" onclick="delName(\''+t+'\','+c.id+')">×</button></span>'}).join("")+'</div><label for="nn">New name</label><div class="acts" style="margin-top:0"><input id="nn" maxlength="40" style="flex:1;min-width:140px"><button class="btn" onclick="addName(\''+t+'\')">Add</button></div><div class="err" id="ce" role="alert"></div><p class="note">A name can only be removed when no items use it.</p>'}
async function addName(t){var v=G("nn").value.trim();if(!v)return;var r=await sb.from(t).insert({name:v});if(r.error){G("ce").textContent="Could not add. It may already exist.";return}await load()}
async function delName(t,id){var r=await sb.from(t).delete().eq("id",id);if(r.error){G("ce").textContent="Remove or move the items using it first.";return}await load()}
function areasBox(){return '<h2>Delivery areas</h2>'+(AREAS.length?AREAS.map(function(a){return '<div class="row"><div><b>'+esc(a.name)+'</b><small>'+$(a.fee)+'</small></div><div class="acts" style="margin:0"><button class="btn ghost sm" onclick="editArea('+a.id+')">Edit</button><button class="btn ghost sm" onclick="delArea('+a.id+')">Remove</button></div></div>'}).join(""):'<p class="note">No areas yet, so every order pays the flat fee of '+$(CFG.fee)+'. Add areas below.</p>')+'<label for="aan">Area name</label><input id="aan" maxlength="40" placeholder="e.g. Penkwasi"><label for="aaf">Delivery fee (GH₵)</label><input id="aaf" type="number" inputmode="decimal" min="0" placeholder="15"><div class="err" id="aae" role="alert"></div><div class="acts"><button class="btn" onclick="saveArea()">Save area</button></div><p class="note">Saving a name that already exists updates its fee.</p>'}
function editArea(id){var a=AREAS.find(function(x){return x.id===id});if(!a)return;G("aan").value=a.name;G("aaf").value=a.fee;G("aan").focus()}
async function saveArea(){var n=G("aan").value.trim(),f=parseFloat(G("aaf").value),e=G("aae");if(!n){e.textContent="Enter the area name.";return}if(!(f>=0)){e.textContent="Enter the fee, like 15.";return}var r=await sb.from("areas").upsert({name:n,fee:f},{onConflict:"name"});if(r.error){e.textContent="Could not save. Run the areas setup in Supabase first.";return}await load()}
async function delArea(id){await sb.from("areas").delete().eq("id",id);await load()}
async function loadSalesData(){
  var r=await sb.from("orders").select("*").order("id",{ascending:false}).limit(1000);
  if(r.error)return null;
  SOLD={};
  r.data.forEach(function(o){if(o.status==="cancelled")return;(o.items||[]).forEach(function(i){SOLD[i.id]=(SOLD[i.id]||0)+i.qty})});
  return r.data;
}
async function setStatus(id,st){var r=await sb.from("orders").update({status:st}).eq("id",id);if(!r.error){SALES=null;loadOrders()}}
async function loadSales(){
  var d=await loadSalesData(),el=G("sl");if(!el)return;
  if(!d){el.textContent="Could not load sales.";return}
  SALES=d;
  var live=d.filter(function(o){return o.status!=="cancelled"}),done=d.filter(function(o){return o.status==="delivered"}),by={};
  live.forEach(function(o){(o.items||[]).forEach(function(i){var b=by[i.id]||(by[i.id]={name:i.name,qty:0,amt:0});b.qty+=i.qty;b.amt+=i.qty*i.price})});
  var L=Object.keys(by).map(function(k){return by[k]}).sort(function(a,b){return b.qty-a.qty}),rev=L.reduce(function(t,b){return t+b.amt},0);
  el.className="";
  el.innerHTML='<div class="row"><span>Orders</span><b>'+live.length+'</b></div><div class="row"><span>Delivered</span><b>'+done.length+'</b></div><div class="row"><span>Value of items sold</span><b>'+$(rev)+'</b></div><p class="note">Totals leave out cancelled orders and delivery fees. Mark orders as delivered in the Orders tab.</p><h2>Sold by item</h2>'+(L.length?L.map(function(b){return '<div class="row"><div><b>'+esc(b.name)+'</b><small>'+b.qty+' sold</small></div><b>'+$(b.amt)+'</b></div>'}).join(""):'<div class="empty">No sales yet.</div>');
}
async function loadOrders(){
  var r=await sb.from("orders").select("*").order("id",{ascending:false}).limit(40),el=G("ol");if(!el)return;
  if(r.error){el.textContent="Could not load orders.";return}
  el.className="";
  el.innerHTML=r.data.length?r.data.map(function(o){return '<div class="row"><div><b>'+esc(o.code)+' · '+$(o.total)+'</b><small>'+esc(o.customer)+' · <a href="tel:'+qa(o.phone)+'">'+esc(o.phone)+'</a></small><small>'+(o.items||[]).map(function(i){return esc(i.qty+" x "+i.name)}).join(", ")+'</small><small>'+(o.delivery?"Deliver: "+esc(o.address):"Pickup")+' · '+esc(o.payment)+' · '+new Date(o.created_at).toLocaleString("en-GH")+'</small><small>Status: <b>'+esc(o.status||"new")+'</b></small><div class="acts" style="margin-top:6px"><button class="btn ghost sm" onclick="setStatus('+o.id+',\'delivered\')">Mark delivered</button><button class="btn ghost sm" onclick="setStatus('+o.id+',\'cancelled\')">Cancel order</button></div></div></div>'}).join(""):"No orders yet.";
}

/* ---------- render ---------- */
function draw(){
  app.innerHTML=({shop:shop,cart:cart,checkout:checkout,done:done,admin:admin,login:login})[S.view]();
  G("mg").textContent=S.user?(S.view==="admin"?"Back to shop":"Manage shop"):"Owner login";
  var n=count();
  if(S.view==="shop"&&n){bar.hidden=false;bar.innerHTML='<button class="btn gold" onclick="go(\'cart\')"><span>View cart ('+n+')</span><span>'+$(sub())+'</span></button>'}
  else if(S.view==="cart"&&n){bar.hidden=false;bar.innerHTML='<button class="btn gold" onclick="go(\'checkout\')"><span>Checkout</span><span>'+$(sub())+'</span></button>'}
  else if(S.view==="checkout"){bar.hidden=false;bar.innerHTML='<button class="btn gold" id="pb" onclick="place()">Place order</button>';fee()}
  else bar.hidden=true;
  if(S.view==="admin"&&S.tab==="orders")loadOrders();
  if(S.view==="admin"&&S.tab==="sales")loadSales();
  if(S.view==="admin"&&S.user&&SALES===null){SALES=[];loadSalesData().then(function(d){SALES=d||[];if(S.view==="admin"&&S.tab==="items"&&S.edit===null)draw()})}
}
G("q").addEventListener("input",function(e){S.q=e.target.value.trim().toLowerCase();if(S.view!=="shop")S.view="shop";draw()});
(async function(){try{var s=await sb.auth.getSession();S.user=s.data.session?s.data.session.user:null}catch(x){}await load()})();
</script>
</body>
</html>
